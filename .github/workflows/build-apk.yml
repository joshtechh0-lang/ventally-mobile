name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install --legacy-peer-deps
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ventally-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - run: cd android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ventally-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  crash-log:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ventally-debug-apk
          path: ./apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: default
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            adb install $(find ./apk -name "*.apk" | head -1)
            adb logcat -c
            adb shell am start -n com.ventally/.MainActivity
            sleep 15
            adb logcat -d > logcat.txt 2>&1
            echo "=== CRASH / FATAL LINES ==="
            grep -E "FATAL|AndroidRuntime|CRASH|beginning of crash|Fatal signal|SIGSEGV|SIGABRT|backtrace|libc.*abort" logcat.txt | head -80 || echo "(no crash lines found)"
            echo "=== FULL LOGCAT (last 300 lines) ==="
            tail -300 logcat.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logcat
          path: logcat.txt
          retention-days: 7
