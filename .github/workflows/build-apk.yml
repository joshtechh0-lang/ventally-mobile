name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ventally-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ventally-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  crash-log:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: ventally-debug-apk
          path: ./apk
      - name: Setup emulator, run APK, capture crash log
        timeout-minutes: 15
        run: |
          ADB=$ANDROID_HOME/platform-tools/adb
          SDK=$ANDROID_HOME/cmdline-tools/latest/bin

          # Install packages
          yes | $SDK/sdkmanager --licenses 2>/dev/null || true
          $SDK/sdkmanager "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64"

          # Create AVD
          echo "no" | $SDK/avdmanager create avd \
            --name test_avd \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_6" \
            --force

          # Start emulator in background
          $ANDROID_HOME/emulator/emulator -avd test_avd -no-window -no-audio -no-snapshot -gpu swiftshader_indirect &
          EMULATOR_PID=$!

          # Wait for boot
          echo "Waiting for emulator..."
          $ADB wait-for-device
          until $ADB shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
            sleep 3
            echo "Still booting..."
          done
          echo "Emulator booted"

          # Install APK
          APK=$(find ./apk -name "*.apk" | head -1)
          echo "Installing: $APK"
          $ADB install "$APK"

          # Clear logs and launch app
          $ADB logcat -c
          $ADB shell am start -n com.ventally/.MainActivity
          sleep 10

          # Capture logs
          $ADB logcat -d > logcat.txt 2>&1

          echo "=== FATAL / CRASH LINES ==="
          grep -E "FATAL|AndroidRuntime|beginning of crash|Fatal signal|SIGSEGV|SIGABRT|backtrace" logcat.txt | head -80

          echo ""
          echo "=== FULL LOG (last 300 lines) ==="
          tail -300 logcat.txt

          kill $EMULATOR_PID 2>/dev/null || true
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logcat
          path: logcat.txt
          retention-days: 7
