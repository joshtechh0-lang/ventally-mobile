name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ventally-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ventally-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  crash-log:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: ventally-debug-apk
          path: ./apk
      - name: Run APK on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86
          target: default
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            APK=$(find ./apk -name "*.apk" | head -1)
            echo "Installing APK: $APK"
            adb install "$APK"
            adb logcat -c
            adb shell am start -n com.ventally/.MainActivity
            sleep 15
            adb logcat -d > logcat.txt 2>&1
            echo "=== CRASH / FATAL LINES ==="
            grep -E "FATAL|AndroidRuntime|CRASH|beginning of crash|Fatal signal|SIGSEGV|SIGABRT|backtrace|libc.*abort" logcat.txt | head -80 || echo "(no crash lines found)"
            echo ""
            echo "=== FULL LOGCAT (last 300 lines) ==="
            tail -300 logcat.txt
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logcat
          path: logcat.txt
          retention-days: 7
